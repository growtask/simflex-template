services:

  php:
    build: docker/php
    volumes: &php-volumes
      - ./:/var/www/html
      - /var/www:/var/www
    ports:
      - "480:80"

  # Планировщик: ./sf cron/run в начале каждой минуты, вместо системного crontab.
  # Включается профилем: docker compose --profile cron up -d
  cron:
    build: docker/php
    volumes: *php-volumes
    working_dir: /var/www/html
    command: sh -c 'while :; do sleep $$((60 - $$(date +%s) % 60)); php sf cron/run; done'
    restart: unless-stopped
    profiles:
      - cron

  db:
    build: docker/mysql
    volumes:
      - ./docker/data/mysql:/var/lib/mysql
    ports:
      - "33066:3306"
    environment:
      MYSQL_DATABASE: simflex
      MYSQL_USER: simflex
      MYSQL_PASSWORD: simflex
      MYSQL_ROOT_PASSWORD: root
      VIRTUAL_HOST: db

  selenium:
    image: selenium/standalone-chrome:latest
    shm_size: 2gb
    ports:
      - "4444:4444"
