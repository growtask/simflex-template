# Codeception Acceptance Test Suite Configuration
#
# Perform tests in a browser by either emulating one using PhpBrowser, or in a real browser using WebDriver.
# If you need both WebDriver and PhpBrowser tests, create a separate suite for each.

actor: AcceptanceTester
modules:
    enabled:
        - WebDriver:
            url: http://app/
            browser: chrome
            host: selenium
            port: 4444
            restart: true
            wait: 10
            window_size: 1920x1080
            capabilities:
                goog:chromeOptions:
                    args: ["--headless", "--disable-gpu", "--no-sandbox", "--disable-dev-shm-usage", "--disable-features=PasswordLeakDetection,PasswordManagerOnboarding"]
                    # the test accounts' password is a leaked one: Chrome's native "change your password" dialog
                    # would swallow the clicks after the login
                    prefs:
                        credentials_enable_service: false
                        profile.password_manager_enabled: false
                        profile.password_manager_leak_detection: false
        - Filesystem
        - Asserts
# Add Codeception\Step\Retry trait to AcceptanceTester to enable retries
step_decorators:
    - Codeception\Step\ConditionalAssertion
    - Codeception\Step\TryTo
    - Codeception\Step\Retry
